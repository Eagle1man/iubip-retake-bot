# Демо-стенд MVP (§12 ТЗ): `docker compose up` поднимает всё, включая миграции и сид.
# Порты БД и Redis наружу НЕ публикуются: на машине разработчика уже живут
# локальные Postgres/Redis, проброшенные на те же 5432/6379 — конфликт портов
# сломал бы `docker compose up` без всякой пользы.
#
# ДВА РЕЖИМА, РАЗНЫЕ БАЗЫ И ТОМА:
#   demo (по умолчанию) — `docker compose up --build`: db, redis, app. Mock-режим,
#                         сид с демо-данными, своя база (том pgdata).
#   prod (профиль)      — `docker compose --profile prod up -d app-prod db-prod redis-prod caddy`:
#                         боевой контур: своя база (том pgdata_prod), без сида,
#                         MOCK_MAX=false, наружу только Caddy.
#
# Почему базы раздельные: демо-стенд и боевой контур не должны делить ни базу,
# ни том — иначе сид демо попадёт в боевые данные.
#
# ПОЧЕМУ ЗДЕСЬ НЕТ ${ПЕРЕМЕННАЯ:?текст}: compose интерполирует переменные для
# ВСЕХ сервисов, включая сервисы за неактивным профилем. Обязательное
# значение (${VAR:?}) ломало бы и `docker compose up` без .env, и CI, где
# боевые секреты не заданы. Обязательность проверяет приложение при старте
# (src/config.ts) — с понятным сообщением.

name: iubip-retake-bot

services:
  # ── Демо-стенд ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-iubip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iubip}
      POSTGRES_DB: ${DB_NAME:-iubip_retake}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iubip} -d ${DB_NAME:-iubip_retake}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${DB_USER:-iubip}:${DB_PASSWORD:-iubip}@db:5432/${DB_NAME:-iubip_retake}
      REDIS_URL: redis://redis:6379
      MOCK_MAX: "true"
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-dev-webhook-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      PAYMENT_API_BASE: http://localhost:3200
      DIRECTORATE_CHAT_ID: "3001"
      FILES_DIR: /data/receipts
      CANCEL_DEADLINE_HOURS: "0"
      REMINDERS_ENABLED: "false"
    volumes:
      - receipts:/data/receipts
    ports:
      # Порт приложения настраивается: на машине, где 3000 занят другой службой,
      # поднимают так: APP_PORT=3100 docker compose up
      - "${APP_PORT:-3000}:3000"
    # Миграции и сид — только здесь: демо-стенд должен быть с данными.
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Боевой контур (профиль prod): своя база, без сида ─────────
  db-prod:
    profiles: ["prod"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-iubip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iubip}
      POSTGRES_DB: ${DB_NAME:-iubip_retake}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iubip} -d ${DB_NAME:-iubip_retake}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-prod:
    profiles: ["prod"]
    image: redis:7-alpine
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-prod:
    profiles: ["prod"]
    build: .
    init: true
    depends_on:
      db-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${DB_USER:-iubip}:${DB_PASSWORD:-iubip}@db-prod:5432/${DB_NAME:-iubip_retake}
      REDIS_URL: redis://redis-prod:6379
      MOCK_MAX: "false"
      # Пустые значения — не ошибка compose: обязательность проверяет приложение
      # (config.ts) и падает с понятным текстом, а не «required variable is missing».
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_BOT_NAME: ${MAX_BOT_NAME:-iubip-retake-bot}
      PAYMENT_API_BASE: ${PAYMENT_API_BASE:-http://host.docker.internal:3200}
      PAYMENT_API_TOKEN: ${PAYMENT_API_TOKEN:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      DIRECTORATE_CHAT_ID: ${DIRECTORATE_CHAT_ID:-3001}
      FILES_DIR: /data/receipts
      CANCEL_DEADLINE_HOURS: ${CANCEL_DEADLINE_HOURS:-0}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-false}
    volumes:
      - receipts_prod:/data/receipts
    # Миграции — да, сид — нет: боевой контур не наполняется демо-данными.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # E2E (§11.3): `docker compose --profile test run --rm e2e`
  # Собирается из стадии build — там лежат vitest и исходники тестов.
  e2e:
    profiles: ["test"]
    build:
      context: .
      target: build
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${DB_USER:-iubip}:${DB_PASSWORD:-iubip}@db:5432/${DB_NAME:-iubip_retake}
      DATABASE_URL_TEST: postgresql://${DB_USER:-iubip}:${DB_PASSWORD:-iubip}@db:5432/${DB_NAME:-iubip_retake}_test
      REDIS_URL: redis://redis:6379
      MOCK_MAX: "true"
      MAX_WEBHOOK_SECRET: dev-webhook-secret
      SERVICE_TOKEN: dev-service-token
      DIRECTORATE_CHAT_ID: "3001"
      FILES_DIR: /tmp/receipts
      CANCEL_DEADLINE_HOURS: "0"
    command: ["npx", "vitest", "run", "--config", "vitest.e2e.config.ts"]

  # Боевой режим с TLS-терминатором (§10):
  #   docker compose --profile prod up -d app-prod db-prod redis-prod caddy
  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    depends_on:
      app-prod:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  pgdata_prod:
  redisdata_prod:
  receipts:
  receipts_prod:
  caddy_data:
  caddy_config:
